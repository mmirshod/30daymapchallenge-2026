[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-the-summit"
version = "0.1.0"
description = "Reproducible terrain visibility research for Tashkent summits >=1800 m"
requires-python = ">=3.12,<3.13"
dependencies = ["geopandas", "rasterio", "numpy", "scipy", "pandas", "pyarrow", "pyproj", "psutil", "requests", "pyyaml", "typer"]

[project.optional-dependencies]
publication = ["matplotlib", "reportlab", "jinja2", "pymupdf==1.26.7"]
browser-qa = ["playwright==1.56.0"]

[project.scripts]
beyond-the-summit = "beyond_the_summit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

